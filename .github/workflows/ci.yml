name: CI

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev, release]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: 'npm'

      - name: Install npm 11.14.0
        run: npm install -g npm@11.14.0

      - name: Verify Node and npm versions
        run: |
          echo "node $(node -v), npm $(npm -v)"
          test "$(node -v)" = "v24.13.0"
          test "$(npm -v)" = "11.14.0"

      - name: Install dependencies
        run: npm ci

      - name: Compile check (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test
